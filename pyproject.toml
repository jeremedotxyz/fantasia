[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasia-cli"
version = "0.1.0"
description = "A terminal-native AI operator modeled after The NeverEnding Story"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "jer", email = "jeremedotxyz@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "Pillow>=10.0.0",
]

[project.scripts]
fantasia = "fantasia.cli:main"

[project.urls]
Homepage = "https://github.com/jeremedotxyz/fantasia"
Repository = "https://github.com/jeremedotxyz/fantasia"
